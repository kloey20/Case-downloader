<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LawPhil Case Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">LawPhil Downloader</h1>

        <div class="mb-6 p-4 bg-gray-50 border rounded-md">
            <label class="block text-sm font-medium text-gray-700 mb-2">Save Directory (Optional)</label>
            <div class="flex space-x-2">
                <input type="text" id="output_folder" placeholder="Leave blank to save next to the application (.exe)" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
                <button type="button" onclick="browseFolder()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 font-medium transition-colors">Browse</button>
                <button type="button" onclick="document.getElementById('output_folder').value=''" class="bg-red-100 text-red-600 px-3 py-2 rounded hover:bg-red-200 transition-colors" title="Clear">✖</button>
            </div>
        </div>

        <form id="queueForm" onsubmit="handleAddToQueue(event)" class="mb-6 flex space-x-2">
            <input type="text" id="case_input" required placeholder="Enter case number (e.g., 238659) and press Enter" 
                   class="flex-1 px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
            <button type="submit" class="bg-blue-600 text-white font-bold py-3 px-8 rounded hover:bg-blue-700 transition-colors shadow-sm">
                Add to Queue
            </button>
        </form>

        <div class="border rounded-md overflow-hidden">
            <div class="bg-gray-50 px-4 py-3 border-b">
                <h3 class="font-semibold text-gray-700">Download Queue</h3>
            </div>
            <ul id="queueList" class="max-h-96 overflow-y-auto divide-y">
                <li class="px-4 py-8 text-center text-gray-500 text-sm">Queue is empty. Add a case above to start automatically downloading.</li>
            </ul>
        </div>
    </div>

    <script>
        // Start polling the server for status updates immediately
        setInterval(fetchQueueStatus, 1500);

        async function browseFolder() {
            try {
                const res = await fetch('/select_folder');
                const data = await res.json();
                if (data.folder) {
                    document.getElementById('output_folder').value = data.folder;
                }
            } catch (e) { console.error("Error opening folder picker"); }
        }

        async function handleAddToQueue(e) {
            e.preventDefault();
            const inputEl = document.getElementById('case_input');
            const caseNum = inputEl.value;
            const folder = document.getElementById('output_folder').value;
            
            const formData = new FormData();
            formData.append('case_number', caseNum);
            formData.append('output_folder', folder);
            
            // Send to backend
            await fetch('/add_to_queue', { method: 'POST', body: formData });
            
            // Clear input field so the user can immediately type the next one
            inputEl.value = ""; 
            fetchQueueStatus(); // Force instant UI update
        }

        async function fetchQueueStatus() {
            try {
                const res = await fetch('/queue_status');
                const tasks = await res.json();
                renderQueueList(tasks);
            } catch (e) { console.error("Polling error"); }
        }

        function renderQueueList(tasks) {
            const list = document.getElementById('queueList');
            const taskValues = Object.values(tasks);
            
            if (taskValues.length === 0) return;
            list.innerHTML = ""; // Clear placeholder

            // Reverse to show newest at the top
            taskValues.reverse().forEach(task => {
                let statusHtml = "";
                let bgColor = "bg-white";

                if (task.status === 'queued') {
                    statusHtml = `<span class="text-gray-500 text-sm font-medium flex items-center"><span class="w-2 h-2 bg-gray-400 rounded-full mr-2"></span>Waiting in line...</span>`;
                } else if (task.status === 'processing') {
                    statusHtml = `<span class="text-blue-600 text-sm font-medium flex items-center">
                                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Searching & Downloading...
                                  </span>`;
                    bgColor = "bg-blue-50";
                } else if (task.status === 'completed') {
                    statusHtml = `<span class="text-green-600 text-sm font-medium block truncate" title="${task.path}">✓ Saved: ${task.path}</span>`;
                    bgColor = "bg-green-50";
                } else if (task.status === 'not_found') {
                    statusHtml = `<span class="text-yellow-600 text-sm font-medium">⚠ Case not found on LawPhil</span>`;
                    bgColor = "bg-yellow-50";
                } else {
                    statusHtml = `<span class="text-red-600 text-sm font-medium">✗ Failed to download</span>`;
                    bgColor = "bg-red-50";
                }

                list.innerHTML += `
                    <li class="px-4 py-4 ${bgColor} transition-colors border-l-4 ${task.status === 'completed' ? 'border-green-500' : task.status === 'processing' ? 'border-blue-500' : task.status === 'not_found' ? 'border-yellow-500' : task.status === 'error' ? 'border-red-500' : 'border-transparent'}">
                        <div class="flex flex-col">
                            <p class="text-base font-bold text-gray-800 mb-1">${task.number}</p>
                            ${statusHtml}
                        </div>
                    </li>
                `;
            });
        }
    </script>
</body>
</html>
